services:
  yt2mpx:
    build: .
    container_name: yt2mpx
    restart: unless-stopped
    ports:
      - "8765:8000"
    environment:
      YTMPX_DATA_DIR: /data
      YTMPX_JOB_TTL_MINUTES: 30
      YTMPX_MAX_PLAYLIST_ITEMS: 200
      YTMPX_YOUTUBE_COOKIES_FILE: /run/yt2mpx-secrets/youtube-cookies.txt
      YTMPX_ACOUSTID_API_KEY: "${YTMPX_ACOUSTID_API_KEY:-}"
      YTMPX_MUSICBRAINZ_USER_AGENT: "${YTMPX_MUSICBRAINZ_USER_AGENT:-yt2mpX/1.0 (local-home-use)}"
    volumes:
      - ./downloads:/data
      - ./secrets:/run/yt2mpx-secrets:ro
