<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">yt2mpX — local media downloader</title>
  <desc id="desc">A technical banner in the app's pale gray, black, and teal visual style. A local transfer panel shows video links becoming MP3, MP4, playlist ZIP, and editable metadata.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9f8"/>
      <stop offset="0.58" stop-color="#e7ebeb"/>
      <stop offset="1" stop-color="#dce3e2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.22" r="0.62">
      <stop offset="0" stop-color="#12e6d0" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#12e6d0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11191b"/>
      <stop offset="1" stop-color="#080b0d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#079d91"/>
      <stop offset="1" stop-color="#12e6d0"/>
    </linearGradient>
    <pattern id="grid" width="68" height="68" patternUnits="userSpaceOnUse">
      <path d="M68 0H0V68" fill="none" stroke="#0b0d0f" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#0b0d0f" opacity="0.12"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-30%" width="150%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#0b0d0f" flood-opacity="0.2"/>
    </filter>
    <clipPath id="panel-clip"><rect x="910" y="76" width="600" height="368" rx="3"/></clipPath>
  </defs>

  <rect width="1600" height="520" fill="url(#paper)"/>
  <rect width="1600" height="520" fill="url(#glow)"/>
  <rect width="1600" height="520" fill="url(#grid)"/>
  <rect width="1600" height="520" fill="url(#dots)" opacity="0.5"/>
  <path d="M42 143V42h116M1442 478h116V377" fill="none" stroke="#0b0d0f" stroke-opacity="0.52" stroke-width="2"/>
  <path d="M58 146V374M1542 143V374" fill="none" stroke="#079d91" stroke-opacity="0.32" stroke-width="1"/>
  <text x="52" y="395" fill="#079d91" font-family="monospace" font-size="22">+</text>
  <text x="1534" y="134" fill="#079d91" font-family="monospace" font-size="22">+</text>

  <rect x="92" y="71" width="48" height="32" fill="none" stroke="#079d91" stroke-opacity="0.52"/>
  <text x="101" y="93" fill="#05756f" font-family="monospace" font-size="17" font-weight="700">001</text>
  <text x="153" y="93" fill="#6f7478" font-family="monospace" font-size="17" font-weight="700" letter-spacing="2">LOCAL TRANSFER / NODE READY</text>
  <path d="M92 119H774" stroke="#0b0d0f" stroke-opacity="0.22"/>

  <text x="85" y="252" fill="#0b0d0f" font-family="Arial Black, Impact, sans-serif" font-size="132" font-weight="900" letter-spacing="-8">yt2mpX</text>
  <path d="M98 268h164m20 0h95m18 0h284" stroke="#0b0d0f" stroke-width="4" stroke-linecap="square"/>
  <path d="M112 281h10m14 0h10m14 0h10m14 0h10m14 0h10" stroke="#0b0d0f" stroke-width="5"/>
  <text x="94" y="340" fill="#0b0d0f" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="900" letter-spacing="1">LOCAL MEDIA DOWNLOADER</text>
  <text x="95" y="384" fill="#4c5659" font-family="Arial, Helvetica, sans-serif" font-size="22">Video and playlists to MP3 or MP4.</text>
  <text x="95" y="415" fill="#4c5659" font-family="Arial, Helvetica, sans-serif" font-size="22">Review metadata. Keep the files.</text>
  <path d="M95 454h160" stroke="url(#accent)" stroke-width="6"/>
  <text x="271" y="461" fill="#05756f" font-family="monospace" font-size="16" font-weight="700" letter-spacing="1.7">SELF-HOSTED / RASPBERRY PI</text>

  <g filter="url(#shadow)">
    <rect x="910" y="76" width="600" height="368" rx="3" fill="url(#dark)"/>
  </g>
  <g clip-path="url(#panel-clip)">
    <rect x="910" y="76" width="600" height="368" fill="url(#dots)" opacity="0.13"/>
    <path d="M910 115h600M910 350h600" stroke="#12e6d0" stroke-opacity="0.28"/>
    <circle cx="943" cy="96" r="5" fill="#12e6d0"/>
    <text x="960" y="102" fill="#e8f6f3" font-family="monospace" font-size="16" font-weight="700" letter-spacing="1.4">TRANSFER CONSOLE</text>
    <text x="1446" y="102" fill="#83bcb5" font-family="monospace" font-size="14">01 / 04</text>

    <text x="945" y="148" fill="#8caeaa" font-family="monospace" font-size="13" letter-spacing="1.6">SOURCE URL</text>
    <rect x="944" y="160" width="399" height="49" fill="#e9eeed"/>
    <text x="961" y="191" fill="#647172" font-family="monospace" font-size="17">youtube.com/watch?v=...</text>
    <rect x="1350" y="160" width="128" height="49" fill="url(#accent)"/>
    <text x="1370" y="191" fill="#062a2a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="900">CHECK LINK</text>

    <path d="M964 243h501" stroke="#6b8f8b" stroke-opacity="0.45" stroke-dasharray="5 7"/>
    <circle cx="964" cy="243" r="5" fill="#12e6d0"/>
    <circle cx="1213" cy="243" r="5" fill="#12e6d0"/>
    <circle cx="1465" cy="243" r="5" fill="#12e6d0"/>
    <rect x="945" y="260" width="151" height="48" fill="#15282a" stroke="#12e6d0" stroke-opacity="0.6"/>
    <rect x="1108" y="260" width="151" height="48" fill="#15282a" stroke="#12e6d0" stroke-opacity="0.6"/>
    <rect x="1271" y="260" width="207" height="48" fill="#15282a" stroke="#12e6d0" stroke-opacity="0.6"/>
    <text x="984" y="291" fill="#e9f8f5" font-family="monospace" font-size="18" font-weight="700">MP3</text>
    <text x="1147" y="291" fill="#e9f8f5" font-family="monospace" font-size="18" font-weight="700">MP4</text>
    <text x="1305" y="291" fill="#e9f8f5" font-family="monospace" font-size="18" font-weight="700">PLAYLIST ZIP</text>

    <text x="945" y="326" fill="#8caeaa" font-family="monospace" font-size="13" letter-spacing="1.6">METADATA / REVIEW / EXPORT</text>
    <path transform="translate(0 10)" d="M945 382h19v-13h9v26h9v-38h9v48h9v-23h9v-11h9v25h9v-42h9v37h9v-18h9v29h9v-46h9v36h9v-23h9v14h9v-34h9v40h9v-16h9v-22h9v35h9v-46h9v47h9v-25h9v13h9v-35h9v40h9v-19h9v-11h9v28h9v-42h9v34h9v-16h9v25h9v-36h9v25h9v-14h9v30h9v-47h9v40h9v-21h9v11h9v-29h9v42h9v-15h9v-18h9v25h9v-35h9v34h9v-15h9v17" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linejoin="miter"/>
    <text x="945" y="428" fill="#88b9b3" font-family="monospace" font-size="13" letter-spacing="1.3">READY FOR YOUR LOCAL LIBRARY</text>
  </g>
  <rect x="910" y="76" width="600" height="368" rx="3" fill="none" stroke="#0b0d0f" stroke-opacity="0.68" stroke-width="2"/>
</svg>
